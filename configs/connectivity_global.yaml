# Connectivity matrix with GLOBAL (all-pairs) attention.
#
# Every node attends to every other node in the same graph — no edge restriction.
# Reach is NOT one hop/layer: a single global-attention layer can already relate
# any two nodes, and with the doubling trick depth ~ O(log n) suffices for
# connectivity (Sanford et al. 2024). So 2 layers here is far more reach than
# 2 GAT hops — the un-capacity-bound counterpart to connectivity_gat / _local.
#
# Run: python main.py --config configs/connectivity_global.yaml

extends: _connectivity_base.yaml

layers:
  - {type: global_attn, heads: 4}
  - {type: global_attn, heads: 4}
