# Isomorphism task with membership tokenization.
#
# Each node's feature is a one-hot component flag: [1,0] for G1, [0,1] for G2.
# Both components use the same feature space, so pair pooling sees [h_G1 | h_G2]
# computed identically for both; for isomorphic pairs h_G1 ≈ h_G2 after global
# attention and the classifier learns to detect equality. No structural features
# in x — all graph structure enters via attention over the 2n tokens.
#
# Run: python main.py --config configs/iso_membership.yaml

extends: _graph_base.yaml

dataset: isomorphism
pooling: pair

node_features: membership
in_channels: 2
