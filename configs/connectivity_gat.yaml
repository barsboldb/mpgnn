# Connectivity matrix with a 2-layer GAT (message-passing baseline).
#
# GAT is attention restricted to graph edges (Veličković 2018) — a transformer
# on the edge set, reach growing one hop per layer. With 2 layers a node sees its
# 2-hop neighbourhood: the depth-bounded regime, like connectivity_local but with
# the efficient message-passing conv instead of dense O(N^2) masked attention.
# Direct GNN-vs-transformer comparison: same engine + same pairwise readout,
# only the conv type differs.
#
# Run: python main.py --config configs/connectivity_gat.yaml

extends: _connectivity_base.yaml

node_features: adj_rows   # plain A rows (GAT adds self-loops internally)

# hidden(64) must be divisible by heads
layers:
  - {type: gat, heads: 4}
  - {type: gat, heads: 4}
