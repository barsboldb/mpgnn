# Connectivity matrix with LOCAL attention (neighbour-masked global_attn).
#
# Each layer has `local: true`, so a node attends only to its graph neighbours
# (+self). Reach grows one hop per layer — the depth-bounded regime where
# capacity / data-lever effects bind (vs global attention's unbounded reach).
# Depth must be >= the graph diameter you want to solve: sweep by adding layers.
#
# Run: python main.py --config configs/connectivity_local.yaml

extends: _connectivity_base.yaml

layers:
  - {type: global_attn, heads: 4, local: true}
  - {type: global_attn, heads: 4, local: true}
