# Sanford-style token transformer — vertices + edges + task token.
#
# Edges are first-class tokens (not an attention bias), so the model must compute
# reachability itself. No LPE, no SPD: the "honest" connectivity setup for
# reproducing the depth-vs-task curve. Connectivity is parallelizable, so accuracy
# is expected to rise with depth (Sanford et al. 2024a, ~log n layers).
# Sweep depth by adding/removing `layers` entries.
#
# Run: python main.py --config configs/token_transformer.yaml

extends: _graph_base.yaml

tokenization: node_edge
node_features: degree # node_edge uses learned identities for node distinctness
in_channels: 1
node_id_dim: 16       # per-node identities so edge tokens can name their endpoints
node_id_mode: learned # 'learned' (deterministic, trainable) actually optimizes;
                      # 'random' is permutation-invariant but stalls at chance

# NOTE: the token transformer always uses pre-norm residual blocks; the base's
# norm_type/residual fields are ignored on this path.

epochs: 500
lr: 0.005

# depth sweep: number of entries = number of transformer layers ('type' ignored)
layers:
  - {type: global_attn, heads: 4}
  - {type: global_attn, heads: 4}
  - {type: global_attn, heads: 4}
  - {type: global_attn, heads: 4}
  - {type: global_attn, heads: 4}
