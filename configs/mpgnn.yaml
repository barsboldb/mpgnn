# Message-passing GNN on connectedness_hard — does an mpGNN reason connectivity?
#
# Degree is useless here (distributions are matched, nodes are symmetric), so
# use RANDOM node features (rGIN): each node gets a random vector, and message
# passing can build a reachable-set fingerprint — nodes in the same component
# converge, different components stay distinct. That is the connectivity signal.
#
# A message-passing GNN's receptive field = number of layers, so it needs
# depth >= the graph diameter (4-8 here, median 5). Residual + BatchNorm fight
# the oversmoothing that otherwise kills deep GINs.
#
# THE TEST is a DEPTH SWEEP: run with `layers` at length 2 / 4 / 6 / 8 / 10 and
# plot best test accuracy vs depth. Expect chance while depth < diameter.
# Swap the layer type (gcn | sage | gat | gin) to compare aggregators.
# (This file consolidates the former mpgnn.yaml and mpgnn_hard.yaml.)
#
# Run: python main.py --config configs/mpgnn.yaml

extends: _graph_base.yaml

model: gnn
node_features: random    # symmetry-breaking random vectors (rGIN)
in_channels: 16          # random feature dimension
input_embedding: linear  # project the random features into hidden

# mpGNN path: BatchNorm + residual (not the transformer's pre-norm LayerNorm)
norm_type: batch
residual: true

lr: 0.005

# depth sweep: set this list to length 2 / 4 / 6 / 8 / 10 and compare
layers:
  - {type: gin}
  - {type: gin}
  - {type: gin}
