# Adjacency-row transformer for graph connectivity.
#
# Each node's token is its row in the adjacency matrix — a binary vector of
# length max_nodes (padded with zeros). Every node gets a structural identity
# derived purely from its neighborhood: no learned positions, no LPE, no edge
# tokens. The transformer attends over the n node tokens and mean-pools.
#
# Depth sweep: add `layers` entries (or -o "layers=[...]").
# Historical note: variants of this config (no_lpe / fixed-n / Yehudai's data)
# established that the ~0.59 plateau on connectedness_hard is a dataset-hardness
# result, not a pipeline bug — see docs/yehudai-empirical.md. Reproduce the
# Yehudai check with: -o dataset=yehudai_connectivity -o in_channels=50
#
# Run: python main.py --config configs/adj_transformer.yaml

extends: _graph_base.yaml

node_features: adj_rows
in_channels: 24       # max_nodes for connectedness_hard (adj_rows pads to this)
hidden_channels: 128  # tuned width for this tokenization

layers:
  - {type: global_attn, heads: 4}
