# Isomorphism task with Laplacian eigenvector tokenization.
#
# Each node's feature is its row in the eigenvector matrix of the normalized
# Laplacian (k smallest non-trivial eigenvectors). For isomorphic pairs the
# eigenvalues are identical; the eigenvectors differ only by sign flips and
# rotations within degenerate eigenspaces, so the representation is
# approximately permutation-equivariant across the two components.
#
# Run: python main.py --config configs/iso_lap.yaml

extends: _graph_base.yaml

dataset: isomorphism
pooling: pair

node_features: lap
in_channels: 16      # eigenvector matrix has shape [n, 16]
