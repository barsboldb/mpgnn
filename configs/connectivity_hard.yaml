# Connectivity matrix on connectedness_hard (variable-n, bridge-edge adversarial).
#
# Same global-attention encoder as connectivity_global, but on the degree- and
# edge-count-matched two-blob dataset where the only class signal is one bridge
# edge. The dense per-pair supervision reaches ~0.97 exact-match here, where the
# binary graph label stalled at ln 2.
#
# Run: python main.py --config configs/connectivity_hard.yaml

extends: _connectivity_base.yaml

dataset: connectedness_hard

epochs: 300
