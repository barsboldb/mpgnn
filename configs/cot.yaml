# Chain-of-thought scratchpad transformer (node_edge tokenization).
#
# Vertices + edges + K scratchpad tokens + task token. The scratchpad gives the
# model *sequential* computation (one round per token) orthogonal to depth: a
# shallow model can unroll a BFS-style frontier expansion over the scratchpad.
# To decide connectivity the model needs cot_len >= diameter, so sweep cot_len
# (4, 8, 12, ...) with depth fixed at 1 to isolate the sequential axis, and look
# for a phase transition near the graph diameter. No LPE / no SPD so the answer
# is not handed to the model in its features.
#
# Hyperparameters are matched to the tuned adj_transformer (hidden 128, depth 1,
# lr 0.001) so the CoT axis is the only difference. (This file consolidates the
# former cot.yaml and cot_adj.yaml.) Full explanation: reports/cot-tokens.typ
#
# Run: python main.py --config configs/cot.yaml -o cot_len=8

extends: _graph_base.yaml

tokenization: node_edge
node_features: degree
in_channels: 1
hidden_channels: 128  # matches adj_transformer
node_id_dim: 16       # per-node identities so edge tokens can name their endpoints
node_id_mode: learned

# chain-of-thought
cot_len: 8            # K scratchpad tokens — the swept variable
cot_mask: causal      # 'causal' (BFS rounds) or 'full' (bidirectional scratchpad)

# keep depth at 1 so any gain comes from the scratchpad, not extra layers
layers:
  - {type: global_attn, heads: 4}
